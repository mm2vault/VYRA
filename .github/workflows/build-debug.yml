name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]

permissions:
  contents: write

jobs:
  build_debug:
    name: Build VYRA Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Configure and verify stable VYRA signing key
        shell: bash
        env:
          VYRA_KEYSTORE_BASE64: ${{ secrets.VYRA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VYRA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYRA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VYRA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${VYRA_KEYSTORE_BASE64:?Missing GitHub secret VYRA_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing GitHub secret VYRA_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing GitHub secret VYRA_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing GitHub secret VYRA_KEY_PASSWORD}"

          mkdir -p app/keystore
          printf '%s' "$VYRA_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore

          test -s app/keystore/release.keystore

          keytool -list \
            -keystore app/keystore/release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            >/dev/null

          echo "Stable VYRA signing key verified successfully."

      - name: Build Debug APK
        run: ./gradlew clean assembleGmsMobileUniversalDebug -PvyraUpdateVersion="15.1.${GITHUB_RUN_NUMBER}" -PvyraUpdateCode="$((142 + GITHUB_RUN_NUMBER))"
        env:
          PULL_REQUEST: "false"
          STORE_PASSWORD: ${{ secrets.VYRA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYRA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VYRA_KEY_PASSWORD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "Android SDK build-tools directory was not found."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in Android SDK build-tools."
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/VYRA-debug.apk"
          cp "$APK" "$RUNNER_TEMP/app-gms-mobile-universal-release.apk"
          echo "path=$RUNNER_TEMP/VYRA-debug.apk" >> "$GITHUB_OUTPUT"
          echo "APK created: $RUNNER_TEMP/VYRA-debug.apk"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: VYRA-debug-apk
          path: ${{ runner.temp }}/VYRA-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v15.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "$RUNNER_TEMP/VYRA-debug.apk" \
            "$RUNNER_TEMP/app-gms-mobile-universal-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VYRA v15.1.${GITHUB_RUN_NUMBER}" \
            --notes "VYRA update build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}." \
            --prerelease
