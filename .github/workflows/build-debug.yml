name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]

permissions:
  contents: write

jobs:
  build_debug:
    name: Build VYRA Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Configure stable VYRA signing key
        if: ${{ secrets.VYRA_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          echo "$VYRA_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
        env:
          VYRA_KEYSTORE_BASE64: ${{ secrets.VYRA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VYRA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYRA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VYRA_KEY_PASSWORD }}

      - name: Build Debug APK
        run: ./gradlew assembleGmsMobileUniversalDebug -PvyraUpdateVersion="15.1.${GITHUB_RUN_NUMBER}" -PvyraUpdateCode="$((142 + GITHUB_RUN_NUMBER))"
        env:
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/VYRA-debug.apk"
          # Compatibility alias so older VYRA builds can update themselves once.
          cp "$APK" "$RUNNER_TEMP/app-gms-mobile-universal-release.apk"
          echo "path=$RUNNER_TEMP/VYRA-debug.apk" >> "$GITHUB_OUTPUT"
          echo "APK created: $RUNNER_TEMP/VYRA-debug.apk"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: VYRA-debug-apk
          path: ${{ runner.temp }}/VYRA-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v15.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "$RUNNER_TEMP/VYRA-debug.apk" \
            "$RUNNER_TEMP/app-gms-mobile-universal-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VYRA v15.1.${GITHUB_RUN_NUMBER}" \
            --notes "VYRA update build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}." \
            --prerelease
